{% extends 'dummy.html' %}

{% block title %}
    <title>Profile Page</title>

{% endblock %}


{% block body_block %}
<style>
  img {
      transition: transform 2s ease;
      cursor: pointer;
      border-radius: 50%;
    }
img:hover{
      transform:  rotate(360deg);
      letter-spacing: 10px;
      color: crimson;
    }
</style>
    <h1>Details of the user are</h1>

    <h2>name is {{UO.username}}</h2>
    
    <h2>email is {{UO.email}}</h2>
    <h2>address is {{PO.address}}</h2>
    <img src="{{PO.profile_pic.url}}" alt="Profile Picture"  style="width: 500px; height: 500px; border-radius: 50%; object-fit: cover; border: 3px solid #ccc;">
{% endblock %}
